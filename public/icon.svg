<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  
  <!-- Subtle Border Glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Central Emerald Emblem -->
  <circle cx="256" cy="256" r="180" fill="url(#bg-grad)" filter="url(#glow)" />

  <!-- Mosque Dome & Architectural Silhouette -->
  <g transform="translate(136, 126) scale(1.0)">
    <!-- Central Dome Arch -->
    <path d="M120 40 C70 40 40 90 40 150 L200 150 C200 90 170 40 120 40 Z" fill="#ffffff" opacity="0.95" />
    
    <!-- Crescent & Star on Top -->
    <path d="M120 10 C128 10 134 16 134 24 C134 32 128 38 120 38 C116 38 112 36 109 33 C115 33 120 28 120 22 C120 16 116 12 110 11 C113 10 116 10 120 10 Z" fill="url(#gold-grad)" />

    <!-- Ledger & Financial Pillar Grid -->
    <!-- Left Column -->
    <rect x="52" y="160" width="28" height="80" rx="6" fill="#ffffff" opacity="0.9" />
    <!-- Center Arch Column -->
    <rect x="96" y="160" width="48" height="80" rx="6" fill="#ffffff" opacity="0.95" />
    <path d="M96 185 C96 165 144 165 144 185 L144 240 L96 240 Z" fill="#047857" />
    <!-- Right Column -->
    <rect x="160" y="160" width="28" height="80" rx="6" fill="#ffffff" opacity="0.9" />
    
    <!-- Base Platform -->
    <rect x="28" y="244" width="184" height="18" rx="6" fill="#ffffff" />
  </g>
</svg>
