# ==============================================================================
# 🕌 Masjid Accounting - Cloudflare Workers & OpenNext Configuration
# ==============================================================================

name = "muslim-community-accounting"
main = ".open-next/worker.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "masjid-db"
database_id = "f48aa1e9-1238-42a7-bdb2-8613fdbfcdc4"

# ------------------------------------------------------------------------------
# Staging Environment
# ------------------------------------------------------------------------------
[env.staging]
name = "muslim-community-accounting-staging"

[env.staging.vars]
NODE_ENV = "production"
NEXT_PUBLIC_APP_URL = "https://staging.bsmc.org.uk"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "masjid-db-staging"
database_id = "84e4d16d-4a31-4338-94e5-02e79bdb80af"

# ------------------------------------------------------------------------------
# Production Environment
# ------------------------------------------------------------------------------
[env.production]
name = "muslim-community-accounting-production"

[env.production.vars]
NODE_ENV = "production"
NEXT_PUBLIC_APP_URL = "https://finance.bsmc.org.uk"

[[env.production.d1_databases]]
binding = "DB"
database_name = "masjid-db"
database_id = "f48aa1e9-1238-42a7-bdb2-8613fdbfcdc4"
